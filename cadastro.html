<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de cadastro</title>
    <link rel="stylesheet" href="assets/css/cadastro.css">
    
</head>
    <body>
       
        <header id="cabecalho">
            <img src="assets/images/lampada.PNG" alt="Imagem de lampada para trocar modo claro para modo escuro" id="lampada">
            <h1>Faça seu cadastro</h1>
            <img src="assets/images/menu.PNG" alt=" icone de menu " id="menu">
        </header>
            

            <label for="nome">Nome Completo *</label><br><br>
            <input type="text" id="nome" placeholder="Digite seu nome completo..." required><br><br>

            <label for="email">E-mail *</label><br><br>
            <input type="email" id="email" placeholder="Digite seu email..." required><br><br>

            <label for="senha">Senha *</label><br><br>
            <input minlength="8" type="password" id="senha" placeholder="Digite sua senha..." required><br><br>

            <label for="acesso">Selecione o seu nivel de acesso *</label><br>
            <select name="acesso" id="acesso" required>
                <option selected hidden value="">Selecione o seu nível de acesso</option>
                <option value="Administrador" >Administrador</option>
                <option value="Moderador" >Moderador</option>
                <option value="Membro" >Membro</option>
                <option value="Visitante" >Visitante</option>
            </select>
            
            <br><br><details>
                <summary>Termos de uso mt legais e nada comprometedores *</summary>
                <p> Eu autorizo a vender meus dados para empresas 100% honestas e nem um pouco ganasiosas blá blá blá blá blá blá blá blá...</p>
                <label for="termos">Eu concordo que li todos os termos :)</label>
                <input type="checkbox" id="termos" required>
            </details>
            

            <button type="submit">Fazer Cadastro</button>
            <br><a href="index.html">Já tenho cadastro</a>
        </form>
        <footer>
            <br><br><br><br><h2>Contato:</h2>
            
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d926.3393294769306!2d-43.35006552456297!3d-21.766427721369!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x989c9cdf447efb%3A0x1a307bc29b9be438!2sA%20Tal%20da%20Esfiha!5e0!3m2!1spt-BR!2sbr!4v1785949829084!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <div id=rodape>
                <img id="logo" src="assets/images/logo.PNG" alt="logo da empresa" >
            </div>
        </footer>
    </body>
</html>
