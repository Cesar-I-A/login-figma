<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cozinha</title>
    <link rel="stylesheet" href="../assets/css/comodos/cozinha.css">
</head>
    <body>
        <header id="cabecalho">
            <img src="../assets/images/lampada.PNG" alt="Imagem de lampada para trocar modo claro para modo escuro" id="lampada"></img>
            <h1>Dashboard Geral Cozinha</h1>
            <div id="menu-container">
                <img src="../assets/images/menu.PNG" alt=" icone de menu " id="menu">
                <div id="menu_aberto">
                    <a class="text_menu" id="choose_room"href="../dashboard.html">Escolher comodo</a>
                    <a class="text_menu" id="config_room"href="../manage_rooms.html">Gerenciar comodo</a>
                    <a class="text_menu" id="leave_room" href="../index.html">Desconectar</a>
                   
                </div>
            </div>
        </header>
        <main id="Aparelhos">

            <section id="lado_esquerdo">

                <h1>Aparelhos do Cômodo</h1>

                <div id="listaAparelhos">

                    <button class="aparelho" data-aparelho="cafeteira">
                        CAFETEIRA
                    </button>

                    <button class="aparelho" data-aparelho="panela">
                        Panela Elétrica
                    </button>

                    <button class="aparelho" data-aparelho="ar">
                        AirFryer
                    </button>

                    
                </div>

            </section>


            <section id="lado_direito">

                <h1 id="tituloAparelho">
                    Dados de Uso - Selecione um aparelho
                </h1>

                <div id="graficos">

                    <div class="grafico">

                        <h3>
                            Consumo de energia
                        </h3>

                        <div class="areaGrafico">
                            <canvas id="graficoConsumo"></canvas>
                        </div>

                    </div>


                    <div class="grafico">

                        <h3>
                            Consumo de energia
                        </h3>

                        <div class="areaGrafico">
                            <canvas id="graficoDiario"></canvas>
                        </div>

                    </div>


                    <div class="grafico">

                        <h3>
                            Horário de pico de uso
                        </h3>

                        <div class="areaGrafico">
                            <canvas id="graficoHorario"></canvas>
                        </div>

                    </div>

                </div>

            </section>

        </main>
        <footer id=rodape>
            <img id="logo" src="../assets/images/logo.PNG" alt="logo da empresa" >
        </footer>
        <script src="../../Bibliotecas Front-End/chart.js/chart.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="../assets/js/comodos/cozinha.js"></script>
    </body>
</html>
