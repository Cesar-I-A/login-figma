<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
    <body>
        <header id="cabecalho">
            <div id="imagens"> 
                <img src="assets/images/logo.PNG" alt="logo da empresa"><br><br>
                <img src="assets/images/lampada.PNG" alt="Imagem de lampada para trocar modo claro para modo escuro">
                <img src="assets/images/menu.PNG" alt=" icone de menu "><br>
            </div>
            <h1>
                Faça seu login 
            </h1>
        </header>
        <form method="get" action=dashboard.html>
            
            <div id="menu">
                <label for="email">E-mail *</label><br><br>
                <input type="email" id="email" placeholder="Enter..." required><br><br>

                <label for="senha">Senha *</label><br><br>
                <input minlength="8" type="password" id="senha" placeholder="Enter" required><br><br>

                <button type="submit">LOGIN</button>
                <br><br><a href="cadastro.html">Não tenho cadastro</a>
                <br><br><a href="esqueci_senha.html">Esqueci minha senha</a>
            </div>
        </form>
    </body>
</html>
