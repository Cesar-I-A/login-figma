<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="assets/css/index.css">
</head>
    <body>
        <header id="cabecalho">
                <img src="assets/images/lampada.PNG" alt="Imagem de lampada para trocar modo claro para modo escuro" id="lampada">
                <h1>Faça seu login </h1>
                <img src="assets/images/menu.PNG" alt=" icone de menu " id="menu">
        </header>
        <main>
            <div id="form">
                <form method="get" action=dashboard.html id="formulario">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" placeholder="Digite seu email..." required>
                    <label for="senha">Senha *</label>
                    <input minlength="8" type="password" id="senha" placeholder="Digite sua senha..." required>
                    <button type="submit">LOGIN</button>
                </form>
                <a href="cadastro.html">Criar conta</a>
                <a href="esqueci_senha.html">Esqueci minha senha</a>
            </div>
        </main>
        <footer id=rodape>
            <img id="logo" src="assets/images/logo.PNG" alt="logo da empresa" >
        </footer>
    </body>
</html>
