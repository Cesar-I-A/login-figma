<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/3f21966000.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/index.css">
</head>
    <body>
        <header id="cabecalho">
            <img src="assets/images/lampada.PNG" alt="Imagem de lampada para trocar modo claro para modo escuro" id="lampada">
            <h1>Esqueci a minha senha </h1>
            <img src="assets/images/menu.PNG" alt=" icone de menu " id="menu">
    </header>
        <form method="get" action=index.html>
           

            <label for="email">E-mail *</label><br><br>
            <input type="email" id="email" placeholder="Digite seu email..." required><br><br>

            <label for="senha">Senha *</label><br><br>
            <input minlength="8" type="password" id="senha" placeholder="Digite sua senha..." required><br><br>

            <label for="senha2">Confirme sua senha *</label><br><br>
            <input minlength="8" type="password" id="senha2" placeholder="Digite sua senha novamente..." required><br><br>

            <button type="submit">Redefinir senha</button>
            
    
        </form>
        <footer id=rodape>
            <img id="logo" src="assets/images/logo.PNG" alt="logo da empresa" >
        </footer>
    </body>
</html>
